name: Build Windows client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check public files
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Test-PublicPrivacy.ps1

      - name: Build Windows client
        run: |
          $ErrorActionPreference = 'Stop'
          & .\src\Build-Windows-Client.ps1

      - name: Check isolated application behavior
        run: |
          $ErrorActionPreference = 'Stop'
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts\Test-PublicSmoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Application checks failed.' }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: 3XUI-Panel-Manager-Windows
          path: dist/3XUI-Panel-Manager.exe
          if-no-files-found: error
